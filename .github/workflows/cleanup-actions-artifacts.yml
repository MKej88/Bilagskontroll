name: Rydd gamle Actions-artifacts

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cleanup-actions-artifacts.yml"

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Slett artifacts eldre enn 24 timer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '24 hours ago' +%s)"
          deleted=0
          kept=0

          while IFS=$'\t' read -r id name created_at; do
            [ -z "${id:-}" ] && continue
            created_epoch="$(date -u -d "$created_at" +%s)"
            if [ "$created_epoch" -lt "$cutoff" ]; then
              echo "Sletter artifact $id ($name), opprettet $created_at"
              gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
              deleted=$((deleted + 1))
            else
              echo "Beholder artifact $id ($name), opprettet $created_at"
              kept=$((kept + 1))
            fi
          done < <(
            gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | [.id, .name, .created_at] | @tsv'
          )

          echo "Slettet: $deleted" >> "$GITHUB_STEP_SUMMARY"
          echo "Beholdt: $kept" >> "$GITHUB_STEP_SUMMARY"
