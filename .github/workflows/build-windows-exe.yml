name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-windows-exe.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  bygg-windows-exe:
    name: Bygg Bilagskontroll.exe
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v5

      - name: Sett opp Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer avhengigheter
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip install pyinstaller

      - name: Bygg EXE-fil
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --noupx
          --windowed
          --name Bilagskontroll
          --icon icons/bilagskontroll_logo_all.ico
          --add-data "icons;icons"
          --collect-data customtkinter
          --collect-data tkinterdnd2
          bilagskontroll.py

      - name: Skann programmet med Microsoft Defender
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"
          $scanner = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $scanner) {
            $scanner = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          }
          if (-not (Test-Path $scanner)) {
            throw "Microsoft Defender mangler. Pakken publiseres ikke uten skanning."
          }
          & $scanner -SignatureUpdate
          if ($LASTEXITCODE -ne 0) {
            throw "Kunne ikke oppdatere Defender-signaturene."
          }
          $program = (Resolve-Path "dist/Bilagskontroll").Path
          & $scanner -Scan -ScanType 3 -File $program -DisableRemediation
          if ($LASTEXITCODE -ne 0) {
            throw "Defender fant en trussel eller skanningen feilet. Se loggen."
          }
          if (-not (Test-Path "$program/Bilagskontroll.exe")) {
            throw "EXE-filen mangler etter skanningen."
          }
          $status = Get-MpComputerStatus
          $hash = (Get-FileHash "$program/Bilagskontroll.exe" -Algorithm SHA256).Hash
          @(
            "Microsoft Defender: skanning fullført uten funn."
            "Signaturversjon: $($status.AntivirusSignatureVersion)"
            "Kildekode: $env:GITHUB_SHA"
            "EXE SHA256: $hash"
            "Dette er ikke en godkjenning fra Chrome/Safe Browsing."
          ) | Tee-Object -FilePath "defender-resultat.txt" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Last opp skanneresultat
        uses: actions/upload-artifact@v6
        with:
          name: Bilagskontroll-skanneresultat
          path: defender-resultat.txt
          if-no-files-found: error
          retention-days: 14

      - name: Kontroller at Windows-programmet starter
        shell: pwsh
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          $app = Start-Process -FilePath "dist/Bilagskontroll/Bilagskontroll.exe" -PassThru
          try {
            do {
              Start-Sleep -Milliseconds 100
              $app.Refresh()
              if ($app.HasExited) {
                throw "Programmet avsluttet før vinduet ble vist (kode $($app.ExitCode))."
              }
            } while ($app.MainWindowHandle -eq 0 -and $timer.Elapsed.TotalSeconds -lt 30)
            if ($app.MainWindowHandle -eq 0) {
              throw "Programvinduet ble ikke vist innen 30 sekunder."
            }
            $seconds = [Math]::Round($timer.Elapsed.TotalSeconds, 2)
            "Tid til første vindu på byggemaskinen: $seconds sekunder." >> $env:GITHUB_STEP_SUMMARY
            Start-Sleep -Seconds 3
            $app.Refresh()
            if ($app.HasExited) {
              throw "Programmet avsluttet rett etter oppstart (kode $($app.ExitCode))."
            }
          } finally {
            if (-not $app.HasExited) {
              Stop-Process -Id $app.Id -Force
            }
          }

      - name: Last opp ferdig program
        uses: actions/upload-artifact@v6
        with:
          name: Bilagskontroll-Windows
          path: dist/Bilagskontroll/
          if-no-files-found: error
          retention-days: 14
